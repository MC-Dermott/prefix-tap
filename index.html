<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Prefix Tap</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap">
<style>
  :root {
    --paper: #f5f8fd;
    --grid: rgba(36, 86, 214, 0.09);
    --ink: #14213d;
    --ink-soft: #4d5b7c;
    --tile: #ffffff;
    --edge: #14213d;
    --line: #c8d2e6;
    --blue: #2456d6;
    --blue-ink: #ffffff;
    --marker: #ffc93c;
    --marker-ink: #14213d;
    --good: #1c9651;
    --good-soft: #d7f3e2;
    --bad: #d23f3f;
    --bad-soft: #fbdede;
    --display: "Bricolage Grotesque", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
    --body: "Atkinson Hyperlegible", "Verdana", "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --paper: #111925;
      --grid: rgba(140, 170, 230, 0.07);
      --ink: #e9eefa;
      --ink-soft: #a2b1cf;
      --tile: #1b2536;
      --edge: #03060b;
      --line: #2c3a53;
      --blue: #6d95ff;
      --blue-ink: #0b1326;
      --marker: #ffcf4d;
      --marker-ink: #14213d;
      --good: #3fcf7e;
      --good-soft: #143826;
      --bad: #ff6f6f;
      --bad-soft: #3d1c20;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #111925;
    --grid: rgba(140, 170, 230, 0.07);
    --ink: #e9eefa;
    --ink-soft: #a2b1cf;
    --tile: #1b2536;
    --edge: #03060b;
    --line: #2c3a53;
    --blue: #6d95ff;
    --blue-ink: #0b1326;
    --marker: #ffcf4d;
    --marker-ink: #14213d;
    --good: #3fcf7e;
    --good-soft: #143826;
    --bad: #ff6f6f;
    --bad-soft: #3d1c20;
  }

  html, body { height: 100%; }
  body {
    background-color: var(--paper);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 26px 26px;
    color: var(--ink);
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.45;
    padding-inline: 16px;
    padding-block: 20px 40px;
    box-sizing: border-box;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }

  .wrap { max-width: 920px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

  /* ---------- Header ---------- */
  .masthead { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark {
    width: 46px; height: 46px; flex-shrink: 0; border-radius: 12px; display: grid; place-items: center;
    background: var(--marker); color: var(--marker-ink); border: 2px solid var(--edge);
    box-shadow: 0 4px 0 var(--edge); font-family: var(--body); font-style: italic; font-weight: 700; font-size: 24px;
  }
  .brand h1 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 30px; letter-spacing: -0.02em; line-height: 1; }
  .brand p { margin: 4px 0 0; color: var(--ink-soft); font-size: 14px; }
  .icon-btn {
    border: 2px solid var(--line); background: var(--tile); border-radius: 999px; padding: 6px 14px;
    font-size: 14px; font-weight: 700; cursor: pointer; color: var(--ink-soft);
  }
  .icon-btn:hover { border-color: var(--ink-soft); color: var(--ink); }

  /* ---------- Setup ---------- */
  .label {
    font-size: 12px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--ink-soft);
    margin: 0 0 10px;
  }
  .packs { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; }
  .pack {
    text-align: left; cursor: pointer; background: var(--tile); border: 2px solid var(--edge); border-radius: 16px;
    padding: 14px 16px 16px; box-shadow: 0 4px 0 var(--edge); display: flex; flex-direction: column; gap: 6px;
    transition: transform .08s ease, box-shadow .08s ease;
  }
  .pack:hover { transform: translateY(-1px); box-shadow: 0 5px 0 var(--edge); }
  .pack[aria-pressed="true"] { background: var(--marker); color: var(--marker-ink); }
  .pack[aria-pressed="true"] .pack-blurb { color: var(--marker-ink); opacity: .8; }
  .pack-eg { font-weight: 700; font-size: 20px; display: flex; align-items: center; gap: 8px; min-height: 44px; }
  .pack-eg .csym { width: 72px; }
  .pack-name { font-family: var(--display); font-weight: 700; font-size: 19px; line-height: 1.15; text-wrap: balance; }
  .pack-blurb { font-size: 14px; color: var(--ink-soft); }

  .panel {
    background: var(--tile); border: 2px solid var(--line); border-radius: 18px; padding: 20px;
    display: flex; flex-direction: column; gap: 20px;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 2px solid var(--line); background: transparent; border-radius: 999px; padding: 7px 14px;
    cursor: pointer; font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; gap: 8px;
  }
  .chip small { font-weight: 400; color: var(--ink-soft); font-size: 13px; }
  .chip[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); color: var(--blue-ink); }
  .chip[aria-pressed="true"] small { color: var(--blue-ink); opacity: .85; }
  .chip:hover:not([aria-pressed="true"]) { border-color: var(--ink-soft); }
  .row-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .link { background: none; border: 0; padding: 0; color: var(--blue); font-weight: 700; font-size: 13px; cursor: pointer; }

  .start-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; justify-content: space-between; }
  .big-btn {
    font-family: var(--display); font-weight: 800; font-size: 24px; letter-spacing: -0.01em;
    background: var(--good); color: #fff; border: 2px solid var(--edge); border-radius: 16px;
    padding: 14px 34px; box-shadow: 0 5px 0 var(--edge); cursor: pointer;
  }
  .big-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--edge); }
  .big-btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; box-shadow: 0 5px 0 var(--edge); }
  .ghost-btn {
    font-weight: 700; font-size: 16px; background: var(--tile); border: 2px solid var(--edge); border-radius: 14px;
    padding: 12px 22px; box-shadow: 0 4px 0 var(--edge); cursor: pointer;
  }
  .ghost-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--edge); }
  .hint { color: var(--ink-soft); font-size: 14px; }
  .hint strong { color: var(--ink); }
  .warn { color: var(--bad); font-weight: 700; font-size: 14px; }

  /* ---------- Symbols and units ---------- */
  /* Quantity symbols are italic, units upright, so m (mass) and m (metres) look different */
  .sym { font-style: italic; white-space: nowrap; }
  .sym sub { font-size: .6em; font-style: normal; }
  .unit { font-style: normal; white-space: nowrap; }
  .unit sup { font-size: .55em; }
  .qty { text-wrap: balance; }
  .pow { white-space: nowrap; }
  .pow sup { font-size: .55em; }
  /* Circuit symbols are drawn in currentColor so they follow the theme and button state */
  .csym { display: block; width: 100%; height: auto; overflow: visible; }

  /* ---------- Game ---------- */
  .hud { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .hud .spacer { flex: 1; }
  .stat {
    display: flex; flex-direction: column; align-items: center; min-width: 88px; padding: 6px 14px;
    background: var(--tile); border: 2px solid var(--edge); border-radius: 12px; box-shadow: 0 3px 0 var(--edge);
  }
  .stat b { font-family: var(--display); font-weight: 800; font-size: 28px; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-soft); }
  .stat.timer.low b { color: var(--bad); }
  .timebar { height: 10px; border-radius: 999px; background: var(--line); overflow: hidden; }
  .timebar i { display: block; height: 100%; width: 100%; background: var(--blue); border-radius: inherit; transform-origin: left; }
  .timebar.low i { background: var(--bad); }

  .question {
    background: var(--tile); border: 2px solid var(--edge); border-radius: 22px; box-shadow: 0 6px 0 var(--edge);
    padding: 18px 20px 24px; text-align: center; position: relative;
  }
  .ask {
    display: inline-block; background: var(--marker); color: var(--marker-ink); font-weight: 700; font-size: 15px;
    padding: 4px 12px; border-radius: 8px; letter-spacing: .01em;
  }
  .prompt {
    font-family: var(--body); font-weight: 700; font-size: clamp(48px, 11vw, 92px); line-height: 1.15;
    margin-top: 10px; min-height: 1.3em; display: flex; align-items: center; justify-content: center; gap: .15em;
  }
  /* Quantity and unit names are words, not symbols */
  .prompt.long { font-size: clamp(30px, 6.5vw, 56px); }
  .prompt.sentence { font-size: clamp(22px, 4.6vw, 36px); max-width: 24em; margin-inline: auto; text-wrap: balance; }
  .prompt.pic .csym { width: clamp(170px, 42vw, 280px); }
  .streak { position: absolute; top: 14px; right: 16px; font-size: 13px; font-weight: 700; color: var(--ink-soft); }
  .streak[data-hot="true"] { color: var(--good); }

  .answers { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .ans {
    background: var(--tile); border: 2px solid var(--edge); border-radius: 16px; box-shadow: 0 5px 0 var(--edge);
    min-height: 86px; font-weight: 700; font-size: clamp(24px, 4.2vw, 34px); cursor: pointer; padding: 6px;
    display: flex; align-items: center; justify-content: center;
    transition: background-color .12s ease, transform .06s ease, box-shadow .06s ease;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .ans:hover:not(:disabled) { background: color-mix(in srgb, var(--marker) 22%, var(--tile)); }
  .ans:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 var(--edge); }
  /* Word answers get fewer, wider buttons */
  .answers.wide { grid-template-columns: repeat(3, 1fr); }
  .answers.wide .ans { font-size: clamp(16px, 2.4vw, 21px); line-height: 1.2; padding: 8px 10px; }
  .answers.pics { grid-template-columns: repeat(3, 1fr); }
  .answers.pics .ans { padding: 10px 18px; }
  .answers.pics .csym { max-width: 130px; }
  .ans.right { background: var(--good); color: #fff; }
  .ans.wrong { background: var(--bad-soft); color: var(--bad); border-color: var(--bad); box-shadow: 0 5px 0 var(--bad); cursor: default; opacity: .8; }
  .ans.wrong.shake { animation: shake .32s ease; }
  @keyframes shake { 20% { transform: translateX(-6px); } 45% { transform: translateX(6px); } 70% { transform: translateX(-3px); } 100% { transform: none; } }
  .pop { animation: pop .22s ease; }
  @keyframes pop { from { transform: scale(.94); opacity: .4; } to { transform: none; opacity: 1; } }

  .countdown {
    position: fixed; inset: 0; display: grid; place-items: center; z-index: 5;
    background: color-mix(in srgb, var(--paper) 80%, transparent);
  }
  .countdown b {
    font-family: var(--display); font-weight: 800; font-size: clamp(90px, 22vw, 200px); color: var(--blue);
    animation: pop .4s ease;
  }

  /* ---------- Learn ---------- */
  .learn-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .learn-head h2 { font-family: var(--display); font-weight: 800; font-size: 28px; margin: 0; line-height: 1.1; }
  .learn-table { width: 100%; border-collapse: separate; border-spacing: 0 8px; }
  .learn-table th {
    text-align: left; font-size: 12px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase;
    color: var(--ink-soft); padding: 0 16px;
  }
  .learn-table th.fam {
    font-family: var(--display); font-size: 20px; letter-spacing: -0.01em; text-transform: none; color: var(--ink);
    padding-top: 16px;
  }
  .learn-table td {
    background: var(--paper); border-block: 2px solid var(--line); padding: 10px 16px; vertical-align: middle;
  }
  .learn-table td:first-child { border-left: 2px solid var(--line); border-radius: 12px 0 0 12px; }
  .learn-table td:last-child { border-right: 2px solid var(--line); border-radius: 0 12px 12px 0; }
  .l-qty { font-weight: 700; font-size: 18px; }
  .l-sym {
    min-width: 52px; height: 52px; padding: 0 8px; border-radius: 12px; display: inline-grid; place-items: center;
    background: var(--marker); color: var(--marker-ink); border: 2px solid var(--edge); box-shadow: 0 3px 0 var(--edge);
    font-weight: 700; font-size: 28px;
  }
  .l-unit { font-weight: 700; font-size: 24px; display: block; }
  .l-uname { font-size: 13px; color: var(--ink-soft); }
  .l-pow { font-weight: 700; font-size: 26px; }
  .l-pic { width: 110px; color: var(--ink); }
  .l-what { font-size: 14px; color: var(--ink-soft); }
  .l-base td { background: transparent; border-block-style: dashed; color: var(--ink-soft); }
  .l-base td:first-child { border-left-style: dashed; }
  .l-base td:last-child { border-right-style: dashed; }
  .l-base .l-sym { background: transparent; color: var(--ink-soft); border-style: dashed; box-shadow: none; font-size: 18px; }

  /* ---------- Results ---------- */
  .results-top { display: grid; grid-template-columns: auto 1fr; gap: 24px; align-items: center; }
  .score-disc {
    width: 170px; height: 170px; border-radius: 50%; display: grid; place-items: center; text-align: center;
    background: var(--marker); color: var(--marker-ink); border: 3px solid var(--edge); box-shadow: 0 6px 0 var(--edge);
  }
  .score-disc b { font-family: var(--display); font-weight: 800; font-size: 72px; line-height: .9; display: block; }
  .score-disc span { font-size: 12px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; }
  .results-top h2 { font-family: var(--display); font-weight: 800; font-size: 34px; margin: 0 0 6px; line-height: 1.05; text-wrap: balance; }
  .kv { display: flex; gap: 22px; flex-wrap: wrap; margin-top: 12px; }
  .kv div { display: flex; flex-direction: column; }
  .kv b { font-size: 24px; font-variant-numeric: tabular-nums; }
  .kv span { font-size: 12px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-soft); }
  .badge { display: inline-block; background: var(--good); color: #fff; font-weight: 700; font-size: 13px; padding: 3px 10px; border-radius: 999px; margin-left: 6px; vertical-align: middle; }
  .review { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 10px; }
  .review li {
    background: var(--paper); border: 2px solid var(--line); border-radius: 12px; padding: 10px 14px;
    font-weight: 700; font-size: 18px; display: flex; align-items: center; gap: .4em; flex-wrap: wrap;
  }
  .review li .sym, .review li .unit { font-size: 22px; }
  .review li .csym { width: 84px; }
  .review li small { font-size: 13px; font-weight: 400; color: var(--ink-soft); width: 100%; }
  .actions { display: flex; gap: 12px; flex-wrap: wrap; }

  @media (max-width: 620px) {
    .answers { grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .ans { min-height: 72px; }
    .answers.wide, .answers.pics { grid-template-columns: repeat(2, 1fr); }
    .l-pic { width: 80px; }
    .results-top { grid-template-columns: 1fr; justify-items: center; text-align: center; }
    .kv { justify-content: center; }
    .stat { min-width: 70px; padding: 4px 10px; }
    .stat b { font-size: 22px; }
    .big-btn { width: 100%; }
    .start-row .actions { width: 100%; flex-direction: column; }
    .learn-table td { padding: 8px 10px; }
    .learn-table th { padding: 0 10px; }
    .learn-table th.fam { padding-top: 12px; }
    .l-qty { font-size: 16px; }
    .l-sym { min-width: 44px; height: 44px; font-size: 24px; }
    .l-unit { font-size: 20px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="masthead">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">μ</div>
      <div>
        <h1>Prefix Tap</h1>
        <p>Scientific prefixes and N5 circuit symbols.</p>
      </div>
    </div>
    <button class="icon-btn" id="sound-toggle" type="button" aria-pressed="true">Sound on</button>
  </header>

  <!-- SETUP -->
  <section id="setup" class="wrap" style="gap:22px">
    <div>
      <p class="label">Choose what to practise</p>
      <div class="packs" id="packs"></div>
    </div>
    <div class="panel">
      <div>
        <div class="row-head"><p class="label">Include</p><button class="link" id="fam-all" type="button">Select all</button></div>
        <div class="chips" id="families"></div>
      </div>
      <div>
        <div class="row-head"><p class="label">Question types</p><button class="link" id="dir-all" type="button">Select all</button></div>
        <div class="chips" id="directions"></div>
      </div>
      <div>
        <p class="label">Time</p>
        <div class="chips" id="times"></div>
      </div>
      <div class="start-row">
        <p class="hint" id="best-line"></p>
        <div class="actions">
          <button class="ghost-btn" id="learn-btn" type="button">Learn</button>
          <button class="big-btn" id="start" type="button">Start</button>
        </div>
      </div>
      <p class="warn" id="setup-warn" hidden>Pick at least one group and one question type.</p>
    </div>
  </section>

  <!-- LEARN -->
  <section id="learn" class="wrap" hidden>
    <div class="panel">
      <div class="learn-head">
        <h2 id="learn-title">Learn</h2>
        <button class="ghost-btn" id="learn-back" type="button">Back</button>
      </div>
      <p class="hint" style="margin:0" id="learn-intro"></p>
      <table class="learn-table" id="learn-table"></table>
      <div class="actions">
        <button class="big-btn" id="learn-start" type="button">Start practising</button>
      </div>
    </div>
  </section>

  <!-- GAME -->
  <section id="game" class="wrap" style="gap:16px" hidden>
    <div class="hud">
      <div class="stat"><b id="score">0</b><span>Score</span></div>
      <div class="stat timer" id="timer-box"><b id="timer">60</b><span id="timer-label">Seconds</span></div>
      <div class="spacer"></div>
      <button class="ghost-btn" id="end" type="button">End round</button>
    </div>
    <div class="timebar" id="timebar"><i id="timefill"></i></div>
    <div class="question">
      <span class="streak" id="streak"></span>
      <span class="ask" id="ask">Find the unit</span>
      <div class="prompt" id="prompt" aria-live="polite"></div>
    </div>
    <div class="answers" id="answers"></div>
  </section>

  <!-- RESULTS -->
  <section id="results" class="wrap" hidden>
    <div class="panel">
      <div class="results-top">
        <div class="score-disc"><div><b id="r-score">0</b><span>Correct</span></div></div>
        <div>
          <h2 id="r-title">Nice work!</h2>
          <p class="hint" id="r-sub"></p>
          <div class="kv">
            <div><b id="r-miss">0</b><span>Wrong taps</span></div>
            <div><b id="r-acc">–</b><span>Accuracy</span></div>
            <div><b id="r-best">–</b><span>Best</span></div>
          </div>
        </div>
      </div>
      <div id="r-review-wrap">
        <p class="label">Facts to practise</p>
        <ul class="review" id="r-review"></ul>
      </div>
      <div class="actions">
        <button class="big-btn" id="again" type="button">Play again</button>
        <button class="ghost-btn" id="change" type="button">Change settings</button>
      </div>
    </div>
  </section>
</div>

<div class="countdown" id="countdown" hidden><b id="count-num">3</b></div>

<script>
/* =====================================================================
   FACT PACKS
   Each pack is a set of facts. To add a new one, push another object
   onto PACKS with:
     id, name, blurb, example (html for the tile)
     reps:       { key: { label, kind, wide?, sentence? } }
                 kind: 'text' | 'pow' | 'circuit'
     families:   [{ id, name, note?, on? }] toggleable subsets of items
     directions: [{ id, label, from, to, ask, on? }]
     items:      [{ family, <rep keys>... }]
     summary(item) -> html shown in "Facts to practise"
     learn       { title, intro, table() -> html for the Learn screen }
   ===================================================================== */

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

/* ---------- prefixes ---------- */

// [family, symbol, name, power], largest to smallest
const PREFIX_ITEMS = [
  ['big',   'G', 'giga',  '9'],
  ['big',   'M', 'mega',  '6'],
  ['big',   'k', 'kilo',  '3'],
  ['extra', 'c', 'centi', '-2'],
  ['small', 'm', 'milli', '-3'],
  ['small', 'μ', 'micro', '-6'],
  ['small', 'n', 'nano',  '-9'],
].map(([family, sym, name, pow]) => ({ family, sym, name, pow }));

const powHtml = p => `<span class="pow">×10<sup>${esc(String(p).replace('-', '−'))}</sup></span>`;

/* ---------- circuit symbols ---------- */

// Drawn on a 100 × 68 canvas, centred on (50, 34), with leads from x = 10 to x = 90 —
// the same shapes and proportions as the N5physics app's circuit diagrams.
const CX = 50, CY = 34;
const ln = (x1, y1, x2, y2, w = 2) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke-width="${w}"/>`;
const rc = (x, y, w, h) => `<rect x="${x}" y="${y}" width="${w}" height="${h}"/>`;
const ci = (x, y, r) => `<circle cx="${x}" cy="${y}" r="${r}"/>`;
const pl = (pts, fill) => `<polygon points="${pts.map(p => p.join(',')).join(' ')}"${fill ? ' fill="currentColor"' : ''}/>`;
const wr = (...pts) => `<polyline points="${pts.map(p => p.join(',')).join(' ')}"/>`;
const tx = (x, y, s) => `<text x="${x}" y="${y}" fill="currentColor" stroke="none" font-size="15" font-weight="700" font-family="Atkinson Hyperlegible, Verdana, sans-serif" text-anchor="middle" dominant-baseline="central">${s}</text>`;
const dot = (x, y) => `<circle cx="${x}" cy="${y}" r="3" fill="currentColor"/>`;
function ar(x1, y1, x2, y2, head = 6) {
  const a = Math.atan2(y2 - y1, x2 - x1);
  const p1 = [x2 - head * Math.cos(a - 0.45), y2 - head * Math.sin(a - 0.45)].map(n => n.toFixed(1));
  const p2 = [x2 - head * Math.cos(a + 0.45), y2 - head * Math.sin(a + 0.45)].map(n => n.toFixed(1));
  return ln(x1, y1, x2, y2, 1.6) + pl([[x2, y2], p1, p2], true);
}
const leads = half => ln(10, CY, CX - half, CY) + ln(CX + half, CY, 90, CY);
const x = CX, y = CY;

const CIRCUIT_DRAW = {
  cell: () => ln(10, y, x - 4, y) + ln(x + 4, y, 90, y) + ln(x - 4, y - 16, x - 4, y + 16) + ln(x + 4, y - 8, x + 4, y + 8, 5),
  battery: () => ln(10, y, x - 12, y) + ln(x + 12, y, 90, y)
    + ln(x - 12, y - 16, x - 12, y + 16) + ln(x - 5, y - 8, x - 5, y + 8, 5) + ln(x - 5, y, x + 5, y)
    + ln(x + 5, y - 16, x + 5, y + 16) + ln(x + 12, y - 8, x + 12, y + 8, 5),
  lamp: () => leads(15) + ci(x, y, 15) + ln(x - 10, y - 10, x + 10, y + 10) + ln(x - 10, y + 10, x + 10, y - 10),
  switch: () => ln(10, y, x - 16, y) + ln(x + 16, y, 90, y) + dot(x - 16, y) + dot(x + 16, y) + ln(x - 16, y, x + 13, y - 14),
  resistor: () => leads(22) + rc(x - 22, y - 9, 44, 18),
  variable: () => leads(22) + rc(x - 22, y - 9, 44, 18) + ar(x - 18, y + 16, x + 20, y - 17),
  fuse: () => leads(20) + rc(x - 20, y - 6, 40, 12) + ln(x - 20, y, x + 20, y),
  ammeter: () => leads(14) + ci(x, y, 14) + tx(x, y + 1, 'A'),
  voltmeter: () => leads(14) + ci(x, y, 14) + tx(x, y + 1, 'V'),
  led: () => leads(17) + ci(x, y, 17) + ln(x - 17, y, x + 17, y)
    + pl([[x - 7, y - 9], [x - 7, y + 9], [x + 6, y]], true) + ln(x + 7, y - 9, x + 7, y + 9)
    + ar(x - 2, y - 19, x + 9, y - 31) + ar(x + 7, y - 17, x + 18, y - 29),
  motor: () => leads(15) + ci(x, y, 15) + tx(x, y + 1, 'M'),
  microphone: () => ln(10, y, x - 15, y) + ln(x + 15, y, 90, y) + ci(x, y, 15) + ln(x - 15, y - 18, x - 15, y + 18, 2.6),
  loudspeaker: () => ln(10, y, x - 12, y) + rc(x - 12, y - 8, 10, 16) + pl([[x - 2, y - 8], [x + 14, y - 20], [x + 14, y + 20], [x - 2, y + 8]]),
  pv: () => leads(20) + ci(x, y, 20) + ln(x - 20, y, x - 3, y) + ln(x + 3, y, x + 20, y)
    + ln(x - 3, y - 12, x - 3, y + 12) + ln(x + 3, y - 6, x + 3, y + 6, 4)
    + ar(x - 32, y - 32, x - 15, y - 18) + ar(x - 18, y - 38, x - 4, y - 22),
  thermistor: () => leads(22) + rc(x - 22, y - 9, 44, 18) + ln(x - 18, y + 16, x + 18, y - 16, 1.6) + ln(x - 28, y + 16, x - 18, y + 16, 1.6),
  ldr: () => leads(22) + ci(x, y, 22) + rc(x - 14, y - 6, 28, 12) + ar(x - 30, y - 34, x - 14, y - 19) + ar(x - 16, y - 40, x - 1, y - 24),
  diode: () => ln(10, y, 90, y) + pl([[x - 9, y - 11], [x - 9, y + 11], [x + 8, y]], true) + ln(x + 9, y - 11, x + 9, y + 11, 2.6),
  capacitor: () => ln(10, y, x - 5, y) + ln(x + 5, y, 90, y) + ln(x - 5, y - 15, x - 5, y + 15, 2.6) + ln(x + 5, y - 15, x + 5, y + 15, 2.6),
  npn: () => ci(x, y, 24) + ln(10, y, x - 9, y) + ln(x - 9, y - 13, x - 9, y + 13, 3)
    + ln(x - 9, y - 5, x + 9, y - 18) + ln(x + 9, y - 18, x + 9, y - 32)
    + ar(x - 9, y + 5, x + 8, y + 17, 8) + ln(x + 9, y + 18, x + 9, y + 32),
  mosfet: () => ci(x, y, 24) + wr([10, y + 9], [x - 13, y + 9]) + ln(x - 13, y - 13, x - 13, y + 13, 2.5)
    + ln(x - 6, y - 15, x - 6, y - 8, 3) + ln(x - 6, y - 4, x - 6, y + 4, 3) + ln(x - 6, y + 8, x - 6, y + 15, 3)
    + wr([x - 6, y - 11], [x + 9, y - 11], [x + 9, y - 32]) + wr([x - 6, y + 11], [x + 9, y + 11], [x + 9, y + 32])
    + ar(x + 9, y, x - 4, y, 7) + ln(x + 9, y, x + 9, y + 11),
};

function circuitSvg(key) {

}

const MAX_BUTTONS = 8, MAX_WIDE = 6;

/* ---------- storage (per-browser conveniences only) ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem('prefixtap:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('prefixtap:' + k, JSON.stringify(v)); } catch (e) {} },

/* ---------- rendering ---------- */
function render(pack, rep, v) {
  const kind = pack.reps[rep].kind;
  if (kind === 'pow') return powHtml(v);
  if (kind === 'circuit') return circuitSvg(v);
  return `<span class="qty">${esc(v)}</span>`;
}

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const uniq = a => [...new Set(a)];

/* ---------- setup state ---------- */
let packId = store.get('pack', 'prefixes');
if (!PACKS.some(p => p.id === packId)) packId = 'prefixes';
const cfgs = {};
function cfgFor(pack) {
  if (!cfgs[pack.id]) {
    const saved = store.get('cfg:' + pack.id, null);
    const famIds = pack.families.map(f => f.id), dirIds = pack.directions.map(d => d.id);
    const fams = saved?.families?.filter(f => famIds.includes(f));
    const dirs = saved?.directions?.filter(d => dirIds.includes(d));
    cfgs[pack.id] = {
      families: fams?.length ? fams : pack.families.filter(f => f.on).map(f => f.id),
      directions: dirs?.length ? dirs : pack.directions.filter(d => d.on).map(d => d.id),
      time: saved?.time ?? 60,
    };
  }
  return cfgs[pack.id];
}
const currentPack = () => PACKS.find(p => p.id === packId);
const bestKey = (pack, cfg) => `best:${pack.id}:${[...cfg.families].sort().join('+')}:${[...cfg.directions].sort().join('+')}:${cfg.time}`;

function chip(label, note, on, onClick) {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'chip';
  b.setAttribute('aria-pressed', on ? 'true' : 'false');
  b.innerHTML = esc(label) + (note ? ` <small>${esc(note)}</small>` : '');
  b.addEventListener('click', onClick);
  return b;
}

function renderSetup() {
  const pack = currentPack(), cfg = cfgFor(pack);
  store.set('pack', packId);
  store.set('cfg:' + pack.id, cfg);

  const packsEl = $('packs'); packsEl.innerHTML = '';
  PACKS.forEach(p => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'pack';
    b.setAttribute('aria-pressed', p.id === packId ? 'true' : 'false');
    b.innerHTML = `<span class="pack-eg">${p.example}</span><span class="pack-name">${esc(p.name)}</span><span class="pack-blurb">${esc(p.blurb)}</span>`;
    b.addEventListener('click', () => { packId = p.id; renderSetup(); });
    packsEl.appendChild(b);
  });

  const toggle = (arr, id) => { const i = arr.indexOf(id); i >= 0 ? arr.splice(i, 1) : arr.push(id); renderSetup(); };

  const fam = $('families'); fam.innerHTML = '';
  pack.families.forEach(f => {
    const note = f.note ?? String(pack.items.filter(it => it.family === f.id).length);
    fam.appendChild(chip(f.name, note, cfg.families.includes(f.id), () => toggle(cfg.families, f.id)));
  });
  const dir = $('directions'); dir.innerHTML = '';
  pack.directions.forEach(d => dir.appendChild(chip(d.label, '', cfg.directions.includes(d.id), () => toggle(cfg.directions, d.id))));
  const times = $('times'); times.innerHTML = '';
  TIMES.forEach(t => times.appendChild(chip(t.label, '', cfg.time === t.id, () => { cfg.time = t.id; renderSetup(); })));

  $('learn-btn').textContent = pack.learn.title;
  const ok = cfg.families.length > 0 && cfg.directions.length > 0;
  $('start').disabled = !ok;
  $('setup-warn').hidden = ok;
  const best = store.get(bestKey(pack, cfg), null);
  const n = pack.items.filter(it => cfg.families.includes(it.family)).length;
  $('best-line').innerHTML = `<strong>${n}</strong> fact${n === 1 ? '' : 's'} selected` +
    (cfg.time && best != null ? ` · Best with these settings: <strong>${best}</strong>` : '');
}

/* ---------- sound ---------- */
let soundOn = store.get('sound', true), actx = null;
function syncSound() {
  const b = $('sound-toggle');
  b.textContent = soundOn ? 'Sound on' : 'Sound off';
  b.setAttribute('aria-pressed', soundOn ? 'true' : 'false');
}
$('sound-toggle').addEventListener('click', () => { soundOn = !soundOn; store.set('sound', soundOn); syncSound(); });
function beep(kind) {
  if (!soundOn) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
    const spec = { ok: ['triangle', 880, 0.14], bad: ['sawtooth', 160, 0.22], tick: ['sine', 520, 0.08], end: ['triangle', 440, 0.5] }[kind];
    o.type = spec[0]; o.frequency.setValueAtTime(spec[1], t);
    if (kind === 'ok') o.frequency.exponentialRampToValueAtTime(1320, t + 0.1);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.12, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + spec[2]);
    o.connect(g).connect(actx.destination);
    o.start(t); o.stop(t + spec[2] + 0.05);
  } catch (e) {}
}

/* ---------- game ---------- */
let G = null;

function show(id) { ['setup', 'learn', 'game', 'results'].forEach(s => $(s).hidden = s !== id); }

function startGame() {
  const pack = currentPack(), cfg = cfgFor(pack);
  G = {
    pack, cfg,
    pool: pack.items.filter(it => cfg.families.includes(it.family)),
    dirs: pack.directions.filter(d => cfg.directions.includes(d.id)),
    score: 0, misses: 0, streak: 0, asked: 0,
    missed: new Map(),   // item -> count of wrong taps
    retry: [],           // { item, dir, due }
    q: null, locked: true, running: false,
    start: 0, raf: 0,
  };
  $('score').textContent = '0';
  $('streak').textContent = '';
  $('timer-label').textContent = cfg.time ? 'Seconds' : 'Time';
  $('timer').textContent = cfg.time ? cfg.time : '0:00';
  $('timebar').hidden = !cfg.time;
  $('timebar').classList.remove('low'); $('timer-box').classList.remove('low');
  $('timefill').style.transform = 'scaleX(1)';
  $('end').textContent = cfg.time ? 'End round' : 'Finish';
  show('game');
  window.scrollTo(0, 0);
  nextQuestion();
  G.locked = true;
  runCountdown(() => { G.locked = false; G.running = true; G.start = performance.now(); tick(); });
}

function runCountdown(done) {
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const box = $('countdown'), num = $('count-num');
  let n = 3;
  box.hidden = false;
  const step = () => {
    if (!G) { box.hidden = true; return; }
    if (n === 0) { box.hidden = true; done(); return; }
    num.textContent = n; num.style.animation = 'none'; void num.offsetWidth; num.style.animation = '';
    beep('tick'); n--;
    setTimeout(step, reduce ? 500 : 700);
  };
  step();
}

function tick() {
  if (!G || !G.running) return;
  const elapsed = (performance.now() - G.start) / 1000;
  if (G.cfg.time) {
    const left = Math.max(0, G.cfg.time - elapsed);
    $('timer').textContent = Math.ceil(left);
    $('timefill').style.transform = `scaleX(${left / G.cfg.time})`;
    const low = left <= 10;
    $('timebar').classList.toggle('low', low); $('timer-box').classList.toggle('low', low);
    if (left <= 0) { finish(); return; }
  } else {
    const s = Math.floor(elapsed);
    $('timer').textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  }
  G.raf = requestAnimationFrame(tick);
}

function chooseQuestion() {
  const due = G.retry.findIndex(r => r.due <= G.asked);
  if (due >= 0) return G.retry.splice(due, 1)[0];
  let item, dir, tries = 0;
  do {
    item = pick(G.pool); dir = pick(G.dirs); tries++;
  } while (tries < 25 && G.q && G.pool.length > 1 && item === G.q.item);
  return { item, dir };
}

function buildOptions(item, dir) {
  const { pack } = G;
  const answer = item[dir.to];
  // Several quantities share a symbol or unit (T is temperature and period, J is used by every energy).
  // Every answer that fits the prompt is kept off the wrong buttons, so only one button is ever correct.
  const fits = new Set(G.pool.filter(x => x[dir.from] === item[dir.from]).map(x => x[dir.to]));
  const valuesOf = list => uniq(list.map(x => x[dir.to])).filter(v => !fits.has(v));
  const rep = pack.reps[dir.to];
  const max = (rep.wide || rep.kind === 'circuit' ? MAX_WIDE : MAX_BUTTONS) - 1;
  // Prefer distractors from the same group, then fill from the rest.
  let opts = shuffle(valuesOf(G.pool.filter(x => x.family === item.family))).slice(0, max);
  if (opts.length < max) {
    const rest = shuffle(valuesOf(G.pool).filter(v => !opts.includes(v)));
    opts = opts.concat(rest.slice(0, max - opts.length));
  }
  // Still short (e.g. one small group)? Borrow from the whole pack.
  if (opts.length < Math.min(max, 3)) {
    const more = shuffle(valuesOf(pack.items).filter(v => !opts.includes(v)));
    opts = opts.concat(more.slice(0, max - opts.length));
  }
  return shuffle([answer, ...opts]);
}

function nextQuestion() {
  const { item, dir } = chooseQuestion();
  const { pack } = G;
  G.asked++;
  G.q = { item, dir, answer: item[dir.to], wrong: false };
  $('ask').textContent = dir.ask;
  const p = $('prompt'), from = pack.reps[dir.from], to = pack.reps[dir.to];
  p.innerHTML = render(pack, dir.from, item[dir.from]);
  p.classList.toggle('long', !!from.wide && !from.sentence);
  p.classList.toggle('sentence', !!from.sentence);
  p.classList.toggle('pic', from.kind === 'circuit');
  p.classList.remove('pop'); void p.offsetWidth; p.classList.add('pop');

  const box = $('answers'); box.innerHTML = '';
  box.classList.toggle('wide', !!to.wide);
  box.classList.toggle('pics', to.kind === 'circuit');
  buildOptions(item, dir).forEach(v => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'ans';
    b.innerHTML = render(pack, dir.to, v);
    b.dataset.v = v;
    b.addEventListener('click', () => answer(b));
    box.appendChild(b);
  });
}

function answer(btn) {
  if (!G || G.locked || btn.disabled) return;
  if (btn.dataset.v === G.q.answer) {
    G.locked = true;
    G.score++; G.streak++;
    $('score').textContent = G.score;
    const st = $('streak');
    st.textContent = G.streak >= 3 ? `${G.streak} in a row` : '';
    st.dataset.hot = G.streak >= 5 ? 'true' : 'false';
    btn.classList.add('right');
    beep('ok');
    setTimeout(() => { if (G && G.running) { G.locked = false; nextQuestion(); } }, 260);
  } else {
    G.misses++; G.streak = 0;
    $('streak').textContent = '';
    btn.classList.add('wrong', 'shake');
    btn.disabled = true;
    beep('bad');
    if (!G.q.wrong) {
      G.q.wrong = true;
      G.missed.set(G.q.item, (G.missed.get(G.q.item) || 0) + 1);
      G.retry.push({ item: G.q.item, dir: G.q.dir, due: G.asked + 3 });
    }
  }
}

function finish() {
  if (!G) return;
  G.running = false; G.locked = true;
  cancelAnimationFrame(G.raf);
  beep('end');
  const { pack, cfg, score, misses } = G;
  const taps = score + misses;
  const key = bestKey(pack, cfg);
  const prevBest = store.get(key, null);
  const isBest = cfg.time > 0 && score > 0 && (prevBest == null || score > prevBest);
  if (isBest) store.set(key, score);

  $('r-score').textContent = score;
  $('r-miss').textContent = misses;
  $('r-acc').textContent = taps ? Math.round(100 * score / taps) + '%' : '–';
  $('r-best').innerHTML = cfg.time ? `${isBest ? score : (prevBest ?? '–')}${isBest ? '<span class="badge">New!</span>' : ''}` : '–';
  const elapsed = Math.round((performance.now() - G.start) / 1000);
  const title = score === 0 ? 'Give it another go' : misses === 0 ? 'Perfect round!' : score >= 20 ? 'Brilliant!' : 'Nice work!';
  $('r-title').textContent = title;
  $('r-sub').textContent = `${pack.name} · ${cfg.time ? cfg.time + ' seconds' : elapsed + ' seconds, no timer'}`;

  const list = $('r-review'); list.innerHTML = '';
  const missed = [...G.missed.entries()].sort((a, b) => b[1] - a[1]);
  $('r-review-wrap').hidden = missed.length === 0;
  missed.forEach(([item, n]) => {
    const li = document.createElement('li');
    li.innerHTML = `${pack.summary(item)}<small>${n} wrong tap${n === 1 ? '' : 's'}</small>`;
    list.appendChild(li);
  });
  show('results');
}

/* ---------- learn ---------- */
function renderLearn() {
  const { learn } = currentPack();
  $('learn-title').textContent = learn.title;
  $('learn-intro').innerHTML = learn.intro;
  $('learn-table').innerHTML = learn.table();
  show('learn');
  window.scrollTo(0, 0);
}

$('learn-btn').addEventListener('click', renderLearn);
$('learn-back').addEventListener('click', () => { show('setup'); renderSetup(); });
$('learn-start').addEventListener('click', startGame);
$('start').addEventListener('click', startGame);
$('again').addEventListener('click', startGame);
$('end').addEventListener('click', () => { if (G && G.running) finish(); else if (G) { G = null; $('countdown').hidden = true; show('setup'); renderSetup(); } });
$('change').addEventListener('click', () => { G = null; show('setup'); renderSetup(); });

syncSound();
renderSetup();
</script>
</body>
